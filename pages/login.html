<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sport Store cung cấp giao diện ecommerce thể thao hiện đại, responsive, dễ sử dụng và tối ưu trải nghiệm.">
  <meta property="og:title" content="Sport Store | Đăng nhập">
  <meta property="og:description" content="Sport Store cung cấp giao diện ecommerce thể thao hiện đại, responsive, dễ sử dụng và tối ưu trải nghiệm.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sport Store">
  <title>Sport Store | Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom/style.css">
  <link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
  <main class="auth min-vh-100 d-grid align-items-center py-5">
    <div class="container">
      <form class="auth-card glass-card mx-auto" data-aos="zoom-in">
        <a class="navbar-brand d-flex align-items-center gap-2 mb-4" href="../index.html">
          <span class="brand-mark"><i class="bi bi-lightning-charge-fill"></i></span>Sport Store
        </a>
        <h1 class="section__title h2">Chào mừng trở lại</h1>
        <p class="section__text">Truy cập đơn hàng, danh sách yêu thích và hồ sơ cá nhân.</p>

        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" required>

        <label class="form-label">Mật khẩu</label>
        <input class="form-control mb-4" type="password" required>

        <button class="btn-premium w-100" type="submit">Đăng nhập</button>

        <p class="mt-4 mb-0 text-center">Chưa có tài khoản?
          <a class="text-primary fw-bold" href="register.html">Đăng ký</a>
        </p>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/design-system.js"></script>
</body>
</html>
